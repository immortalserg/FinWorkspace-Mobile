name: Android standalone APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The ubuntu runner already includes Android SDK. Avoid sdkmanager setup failures.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate FinWorkspace icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 assets/finworkspace.svg > assets/icon.png
          rsvg-convert -w 1024 -h 1024 assets/finworkspace.svg > assets/adaptive-icon.png
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Enable HTTP for local Home Assistant servers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          manifest = p.read_text()
          if 'android:usesCleartextTraffic=' not in manifest:
              manifest = manifest.replace('<application ', '<application android:usesCleartextTraffic="true" ', 1)
          else:
              import re
              manifest = re.sub(r'android:usesCleartextTraffic="[^"]*"', 'android:usesCleartextTraffic="true"', manifest, count=1)
          assert 'android:usesCleartextTraffic="true"' in manifest
          p.write_text(manifest)
          PY
      - name: Verify Android cleartext policy
        run: |
          echo "=== Merged manifest network configuration ==="
          grep -R -n -E 'usesCleartextTraffic|networkSecurityConfig' android/app/src/main/AndroidManifest.xml android/app/src/main/res/xml 2>/dev/null || true
          echo "=== Android manifest ==="
          sed -n '1,100p' android/app/src/main/AndroidManifest.xml
      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finworkspace-mobile-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
